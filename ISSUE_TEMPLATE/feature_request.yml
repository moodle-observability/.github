name: Feature request
description: Suggest a new feature or improvement.
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion! Please search existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or plugins you have considered.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links to Moodle or tool documentation, screenshots, examples.
